name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    uses: ./.github/workflows/release-publish.yml
    secrets: inherit
