name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity and security gate
        id: release
        env:
          HEVY_CANONICAL_REPOSITORY: ${{ vars.HEVY_CANONICAL_REPOSITORY }}
          HEVY_PRIVATE_ADVISORY_VERIFIED: ${{ vars.HEVY_PRIVATE_ADVISORY_VERIFIED }}
        run: ./scripts/validate-release.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Validate workflow syntax
        run: ./scripts/run-actionlint.sh

      - name: Validate pinned OpenAPI snapshot
        run: ./scripts/validate-openapi.sh

      - name: Audit repository release content
        run: ./scripts/audit-repository.sh

      - name: Restore release dependencies
        run: dotnet restore HevyClient.slnx --locked-mode

      - name: Verify release formatting
        run: dotnet format HevyClient.slnx --verify-no-changes --no-restore

      - name: Build release assembly
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: dotnet build HevyClient.slnx --configuration Release --no-restore -warnaserror -p:Version="$RELEASE_VERSION"

      - name: Run all non-live release tests
        run: env -u HEVY_API_KEY -u HEVY_LIVE_TESTS -u HEVY_LIVE_MUTATION_TESTS -u MCP_AUTH_TOKEN dotnet test HevyClient.slnx --configuration Release --no-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable version tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          repository_path="${IMAGE#ghcr.io/}"
          if ! status="$(curl --silent --show-error \
            --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request HEAD \
            "https://ghcr.io/v2/$repository_path/manifests/$RELEASE_VERSION")"; then
            echo "The registry availability probe failed." >&2
            exit 1
          fi
          case "$status" in
            200)
              echo "The immutable release tag already exists." >&2
              exit 1
              ;;
            404)
              ;;
            *)
              echo "The registry availability probe returned unexpected HTTP status $status." >&2
              exit 1
              ;;
          esac

      - name: Build and stage immutable multi-architecture digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          tags: ${{ steps.release.outputs.image }}
          outputs: type=image,name=${{ steps.release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.revision }}
            SOURCE_URL=${{ steps.release.outputs.source }}
          provenance: mode=max
          sbom: true

      - name: Verify published digest platforms labels and assembly version
        id: image
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          SOURCE_URL: ${{ steps.release.outputs.source }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build output was not an immutable SHA-256 digest." >&2
            exit 1
          fi
          index_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$index_file" "$response_file"' EXIT
          docker buildx imagetools inspect --raw "$IMAGE@$IMAGE_DIGEST" > "$index_file"
          test "$(jq '[.manifests[] | select(.platform.os != "unknown")] | length' "$index_file")" = "2"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "$index_file")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "$index_file")"
          printf 'amd64_digest=%s\n' "$amd64_digest" >> "$GITHUB_OUTPUT"
          printf 'arm64_digest=%s\n' "$arm64_digest" >> "$GITHUB_OUTPUT"
          for platform_digest in "$amd64_digest" "$arm64_digest"; do
            labels="$(docker buildx imagetools inspect "$IMAGE@$platform_digest" --format '{{json .Image.Config.Labels}}')"
            jq -e --arg version "$RELEASE_VERSION" --arg revision "$REVISION" --arg source "$SOURCE_URL" \
              '."org.opencontainers.image.version" == $version and ."org.opencontainers.image.revision" == $revision and ."org.opencontainers.image.source" == $source and ."org.opencontainers.image.licenses" == "MIT"' \
              <<<"$labels" >/dev/null
          done
          coproc MCP_SERVER {
            docker run --rm -i --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m -e HEVY_API_KEY=release-fixture "$IMAGE@$amd64_digest"
          }
          input_fd=${MCP_SERVER[1]}
          output_fd=${MCP_SERVER[0]}
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release-verifier","version":"1.0"}}}' >&"$input_fd"
          IFS= read -r response <&"$output_fd"
          printf '%s\n' "$response" > "$response_file"
          exec {input_fd}>&-
          wait "$MCP_SERVER_PID"
          test "$(jq -er 'select(.id == 1) | .result.serverInfo.version' "$response_file")" = "$RELEASE_VERSION.0"

      - name: Extract platform SPDX SBOMs
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST" --format '{{json (index .SBOM "linux/amd64").SPDX}}' > "dist/hevy-client-$RELEASE_VERSION-linux-amd64.spdx.json"
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST" --format '{{json (index .SBOM "linux/arm64").SPDX}}' > "dist/hevy-client-$RELEASE_VERSION-linux-arm64.spdx.json"
          jq -e '.spdxVersion | startswith("SPDX-")' "dist/hevy-client-$RELEASE_VERSION-linux-amd64.spdx.json" >/dev/null
          jq -e '.spdxVersion | startswith("SPDX-")' "dist/hevy-client-$RELEASE_VERSION-linux-arm64.spdx.json" >/dev/null

      - name: Upload SPDX SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hevy-client-${{ steps.release.outputs.version }}-spdx-sbom
          path: dist/*.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest SBOM artifacts provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.spdx.json

      - name: Attest container provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest amd64 container SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.amd64_digest }}
          sbom-path: dist/hevy-client-${{ steps.release.outputs.version }}-linux-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 container SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.image.outputs.arm64_digest }}
          sbom-path: dist/hevy-client-${{ steps.release.outputs.version }}-linux-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Keylessly sign and verify the immutable digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_URL: ${{ steps.release.outputs.source }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
          certificate_identity="$SOURCE_URL/.github/workflows/release.yml@refs/tags/v$RELEASE_VERSION"
          cosign verify "$IMAGE@$IMAGE_DIGEST" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Verify GitHub attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.image.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.image.outputs.arm64_digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify "oci://$IMAGE@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$REVISION" \
            --source-ref "refs/tags/v$RELEASE_VERSION" \
            --bundle-from-oci
          for platform_digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            gh attestation verify "oci://$IMAGE@$platform_digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$REVISION" \
              --source-ref "refs/tags/v$RELEASE_VERSION" \
              --predicate-type https://spdx.dev/Document \
              --bundle-from-oci
          done

      - name: Promote verified digest to immutable version tag
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          metadata_file="$(mktemp)"
          trap 'rm -f "$metadata_file"' EXIT
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE_VERSION" \
            --metadata-file "$metadata_file" \
            "$IMAGE@$IMAGE_DIGEST"
          test "$(jq -er '."containerimage.descriptor".digest' "$metadata_file")" = "$IMAGE_DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')" = "$IMAGE_DIGEST"
